<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="空調設備管理データの参照画面" />
    <title>空調設備一覧 | Kamada</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/aircon.js" type="module"></script>
  </head>
  <body>
    <main id="aircon-view" class="aircon-shell" hidden>
      <header class="app-header">
        <a class="app-brand" href="/" aria-label="Kamada Knowledge Assistant">
          <span class="brand-mark brand-mark-small" aria-hidden="true">K</span>
          <span>
            <strong>Kamada</strong>
            <small>Aircon Management</small>
          </span>
        </a>

        <div class="account-area">
          <a class="text-button header-link" href="/">チャット</a>
          <span id="aircon-user-name" class="user-name"></span>
          <button id="aircon-logout-button" class="text-button" type="button">
            ログアウト
          </button>
        </div>
      </header>

      <section class="aircon-dashboard" aria-labelledby="aircon-title">
        <div class="aircon-heading">
          <div>
            <p class="eyebrow">FACILITY INVENTORY</p>
            <h1 id="aircon-title">空調設備一覧</h1>
            <p class="muted">会社・物件・設備系統ごとに登録機器を確認できます。</p>
          </div>
          <button id="aircon-reload-button" class="secondary-button" type="button">
            再読み込み
          </button>
        </div>

        <p id="aircon-error" class="form-error dashboard-error" role="alert" hidden></p>

        <section id="aircon-summary" class="summary-grid" aria-label="登録件数"></section>

        <section aria-labelledby="inventory-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">INVENTORY</p>
              <h2 id="inventory-title">設置構成</h2>
            </div>
          </div>
          <div id="aircon-inventory" class="inventory-list"></div>
        </section>

        <section aria-labelledby="models-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">MODEL MASTER</p>
              <h2 id="models-title">機器型式マスター</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th scope="col">メーカー</th>
                  <th scope="col">型式</th>
                  <th scope="col">更新日時</th>
                </tr>
              </thead>
              <tbody id="aircon-models"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
